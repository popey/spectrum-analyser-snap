name: Sync version with upstream

on:
  schedule:
    - cron: '23 10 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spectrum-analyser-upstream
  cancel-in-progress: false

jobs:
  update:
    if: github.repository == 'popey/spectrum-analyser-snap'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      number: ${{ steps.pr.outputs.pull-request-number }}
      commit: ${{ steps.pr.outputs.pull-request-head-sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Test release selection
        run: python3 -m unittest discover -s tests -v
      - name: Check published weekly releases
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/update-upstream.py --write --github-output "$GITHUB_OUTPUT"
      - name: Create or update release PR
        if: steps.upstream.outputs.needs_update == 'true'
        id: pr
        uses: peter-evans/create-pull-request@v7
        with:
          branch: auto-update-spectrum-analyser
          base: ${{ github.event.repository.default_branch }}
          delete-branch: true
          add-paths: snap/snapcraft.yaml
          commit-message: 'Update Spectrum Analyser to ${{ steps.upstream.outputs.latest }}'
          title: 'Update Spectrum Analyser to ${{ steps.upstream.outputs.latest }}'
          body: |
            Update from `${{ steps.upstream.outputs.current }}` to `${{ steps.upstream.outputs.latest }}`.

            [Upstream release](https://github.com/TheGoodDoktor/8BitAnalysers/releases/tag/${{ steps.upstream.outputs.latest }})

            This run attempts an LXD build, snap review, and desktop VM smoke test of the PR commit.
            Check the [validation run and artifacts](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            for the result, snap, application logs, and screenshots. This PR is not proof that validation passed.

  # Call explicitly: automated PR events can require approval before running CI.
  validate:
    needs: update
    if: needs.update.outputs.number != ''
    uses: ./.github/workflows/snap.yml
    with:
      ref: ${{ needs.update.outputs.commit }}
