name: 🧪 Build and smoke test snap

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Exact commit to build and test
        required: true
        type: string
  schedule:
    # Weekly build on Mondays at 04:00 UTC
    - cron: '0 4 * * 1'

permissions:
  contents: read

jobs:
  build:
    name: 🔨 Build snap
    runs-on: ubuntu-24.04

    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Test release selection
        run: python3 -m unittest discover -s tests -v

      - name: Build snap
        uses: snapcore/action-build@v1
        id: build
        with:
          snapcraft-args: --use-lxd

      - name: Show log on build failure
        if: failure()
        run: cat /home/runner/.local/state/snapcraft/log/snapcraft*.log

      - name: Review snap
        uses: diddlesnaps/snapcraft-review-action@v1
        with:
          snap: ${{ steps.build.outputs.snap }}
          isClassic: 'false'

      - name: Upload snap artifact
        if: always() && steps.build.outputs.snap != ''
        uses: actions/upload-artifact@v4
        with:
          name: snap
          path: ${{ steps.build.outputs.snap }}
          retention-days: 7

  smoke-test:
    name: 💨 Smoke test (launch + screenshot)
    runs-on: ubuntu-24.04
    needs: build
    # Use ghvmctl's supported guest default, as in the other graphical snaps.
    # Its current input tooling requires newer packages than Ubuntu 24.04 ships.

    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Download snap artifact
        uses: actions/download-artifact@v4
        with:
          name: snap

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Setup LXD
        uses: canonical/setup-lxd@v0.1.1

      - name: Setup ghvmctl
        run: |
          sudo snap install ghvmctl
          sudo snap connect ghvmctl:lxd lxd:lxd

      - name: Prepare VM
        id: vm
        timeout-minutes: 15
        run: ghvmctl prepare

      - name: Install snap into VM
        run: |
          shopt -s nullglob
          snaps=(*.snap)
          test "${#snaps[@]}" -eq 1
          SNAP_FILE=${snaps[0]}
          echo "Pushing $SNAP_FILE into VM..."
          VM_NAME=$(ghvmctl exec hostname | tr -d '[:space:]')
          lxc file push "$SNAP_FILE" "local:$VM_NAME/home/ubuntu/$SNAP_FILE"
          ghvmctl exec sudo snap install --dangerous "/home/ubuntu/$SNAP_FILE"

      - name: Prepare window check
        run: |
          ghvmctl exec sudo apt-get install -y xdotool
          VM_NAME=$(ghvmctl exec hostname | tr -d '[:space:]')
          lxc file push scripts/check-window.sh "local:$VM_NAME/home/ubuntu/check-window.sh"

      - name: Launch app and wait for it to render
        timeout-minutes: 3
        run: |
          ghvmctl snap-run spectrum-analyser
          ghvmctl exec bash /home/ubuntu/check-window.sh

      - name: Take screenshots
        run: |
          ghvmctl screenshot-full
          ghvmctl screenshot-window
          shopt -s nullglob
          screens=("$HOME"/ghvmctl-screenshots/screenshot-screen*.png)
          windows=("$HOME"/ghvmctl-screenshots/screenshot-window*.png)
          test "${#screens[@]}" -gt 0
          test "${#windows[@]}" -gt 0
          for screenshot in "${screens[@]}" "${windows[@]}"; do
            test -s "$screenshot"
          done
          ghvmctl exec pgrep -x SpectrumAnalyse

      - name: Capture failure desktop
        if: failure() && steps.vm.outcome == 'success'
        continue-on-error: true
        run: ghvmctl screenshot-full

      - name: Collect application diagnostics
        if: always() && steps.vm.outcome == 'success'
        run: |
          mkdir -p artifacts
          ghvmctl exec cat /home/ubuntu/spectrum-analyser.log > artifacts/application.log 2>&1 || true
          ghvmctl exec sudo snap connections spectrum-analyser > artifacts/connections.log 2>&1 || true

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-logs
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-test-screenshots
          path: ~/ghvmctl-screenshots/
          if-no-files-found: warn
          retention-days: 14

      - name: Summarize smoke test
        if: always()
        env:
          RESULT: ${{ job.status }}
        run: |
          echo "Desktop smoke test: $RESULT. See smoke-test-screenshots and smoke-test-logs artifacts for evidence." >> "$GITHUB_STEP_SUMMARY"
